# Local production-like stack: docker compose up --build
# Requires trained artifacts in backend/models/ (see DEPLOYMENT.md).
services:
  api:
    build: ./backend
    environment:
      ENVIRONMENT: production
      CORS_ORIGINS: '["http://localhost:3000"]'
      # ENABLE_DOCS: "true"            # expose /docs if you need it
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000   # URL the BROWSER uses to reach the API
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
